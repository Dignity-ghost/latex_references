<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">LaTeX References cross-platform workflow</title>
  <desc id="description">Markdown source flows through the Obsidian plugin to clickable rendered references while remaining portable to LaTeX.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b2e"/>
      <stop offset="1" stop-color="#262044"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b7a7ff"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="24" fill="url(#background)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="55" y="72" width="230" height="156" rx="18" fill="#262c49" stroke="#8d7bf7" stroke-width="3"/>
    <text x="170" y="122" fill="#ffffff" font-size="25" font-weight="700">Markdown + LaTeX</text>
    <text x="170" y="161" fill="#d8d5ed" font-size="19">\label · \ref · \cite</text>
    <text x="170" y="194" fill="#a9a4c8" font-size="16">portable source</text>

    <path d="M300 150 H382" fill="none" stroke="#b7a7ff" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="390" y="72" width="180" height="156" rx="18" fill="#6f5bd3"/>
    <text x="480" y="135" fill="#ffffff" font-size="25" font-weight="700">Obsidian</text>
    <text x="480" y="174" fill="#f0edff" font-size="19">LaTeX References</text>

    <path d="M578 150 H660" fill="none" stroke="#b7a7ff" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="675" y="72" width="230" height="156" rx="18" fill="#262c49" stroke="#8d7bf7" stroke-width="3"/>
    <text x="790" y="122" fill="#ffffff" font-size="25" font-weight="700">Rendered note</text>
    <text x="790" y="161" fill="#d8d5ed" font-size="19">(1) · [1] · links</text>
    <text x="790" y="194" fill="#a9a4c8" font-size="16">desktop + mobile</text>
  </g>
</svg>
